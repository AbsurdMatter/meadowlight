<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Meadowlight 🐝 — a cozy voxel bee meadow</title>
    <meta name="description" content="A cozy voxel meadow you plant with flowers, bees, and gentle pollinator ecology. No fail states — the meadow quietly thrives. Playable in the browser." />
    <meta property="og:title" content="Meadowlight" />
    <meta property="og:description" content="Plant a voxel meadow, keep bees, and learn real pollinator ecology along the way — no fail states, ever." />
    <meta property="og:type" content="website" />
    <!-- og:image: replace the placeholder domain with the real deployment
         URL once hosting is known (post-session-6 deploy); the tags below are
         absolute-URL-ready — only the origin changes -->
    <meta property="og:image" content="https://meadowlight.example/og-image.png" />
    <meta property="og:image:alt" content="A warm voxel meadow with flowers, a skep hive, and foraging bees" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; }
      body { font-family: 'Nunito', ui-rounded, "SF Pro Rounded", system-ui, sans-serif; background: #f7d9a3; }
      /* round 5 (PR #49 comment #6560170382): the two font ROLES, both
         self-hosted OFL woff2 — the embed never fetches fonts at runtime.
         BODY = Nunito 400/500/700 (legible small-size body copy),
         HEADINGS = Silkscreen 400/700 (pixel identity for titles/labels).
         The stacks themselves live in src/data/typography.ts; the families
         here are what those stacks reference. */
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/nunito-v32-latin-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/nunito-v32-latin-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/nunito-v32-latin-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Silkscreen';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/silkscreen-v6-latin-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Silkscreen';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/silkscreen-v6-latin-700.woff2') format('woff2');
      }
      /* round-4 leftovers kept for the ?font-preview=1 comparison overlay
         only (src/ui/FontPreview.tsx) — not referenced by the app theme.
         Varela Round (candidate C, not picked) + the old Pixelify files. */
      @font-face {
        font-family: 'Cand Varela Round';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/varela-round-v21-latin-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/pixelify-sans-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/pixelify-sans-latin-500-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pixelify Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/pixelify-sans-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cand Silkscreen';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/silkscreen-v6-latin-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cand Silkscreen';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/silkscreen-v6-latin-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cand Nunito';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/nunito-v32-latin-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cand Nunito';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('./fonts/nunito-v32-latin-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cand Nunito';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('./fonts/nunito-v32-latin-700.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
