      /* round 5 (PR #49 comment #6560170382): the two font ROLES, both
         self-hosted OFL woff2 — the embed never fetches fonts at runtime.
         BODY = Nunito 400/500/700 (legible small-size body copy),
         HEADINGS = Silkscreen 400/700 (pixel identity for titles/labels).
         The stacks themselves live in src/data/typography.ts; the families
         here are what those stacks reference. */
      /* P4 (i18n): latin-ext faces carry the Slovenian diacritics (č š ž).
         unicode-range keeps the latin subset primary for ASCII text. */

        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/nunito-latin-ext-400-normal.woff2') format('woff2');
