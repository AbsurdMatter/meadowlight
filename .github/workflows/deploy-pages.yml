name: Deploy to GitHub Pages

# #17 (session 6, bare minimum per user): build dist/ and publish it to
# GitHub Pages on every push to main. No CNAME this session — the default
# Pages URL only; pointing the portfolio subdomain at it is a documented
# POST-DEPLOY step (README "Embedding & deploying").

on:
  # Session 8 deploy unit: RE-ENABLED (the deploy session arrived — v3 plan
  # of record; was disabled per PR #37 comment #6298625613). Runs on push to
  # main only (merge), so the branch CI stays smoke-only.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
